<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}BarberPy{% endblock %}</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}"> BarberPy </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'home' %}"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Agendar</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Meus Agendamentos</a>
            </li>
          </ul>

          <ul class="navbar-nav">

    {% if user.is_authenticated %}

        <li class="nav-item">
            <span class="nav-link">
                Olá, {{ user.first_name|default:user.username }}
            </span>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="{% url 'logout' %}">
                Sair
            </a>
        </li>

    {% else %}

        <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">
                Entrar
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="{% url 'cadastro' %}">
                Cadastrar
            </a>
        </li>

    {% endif %}

</ul>

        </div>
      </div>
    </nav>

    <main>{% block content %} {% endblock %}</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
