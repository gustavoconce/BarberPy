{% extends 'base.html' %}

{% block title %}
Cadastro
{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:600px;">

    <h2 class="mb-4">
        Cadastro
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            class="btn btn-dark"
            type="submit">

            Cadastrar

        </button>

    </form>

</div>

{% endblock %}
