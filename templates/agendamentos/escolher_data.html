{% extends 'base.html' %}

{% block title %}
Escolher Data
{% endblock %}

{% block content %}

<div class="container" style="max-width: 600px;">

    <h2 class="mb-4">
        Escolha a data
    </h2>

    <h5>
        {{ barbeiro.first_name }} {{ barbeiro.last_name }}
    </h5>

    <p>
        Serviço: {{ servico.nome }}
    </p>

    <form method="GET"
          action="{% url 'lista_horarios' barbeiro.id servico.id %}">

        <div class="mb-3">

            <label class="form-label">

                Data

            </label>

            <input
                type="date"
                name="data"
                class="form-control"
                required>

        </div>

        <button
            class="btn btn-dark">

            Ver horários

        </button>

    </form>

</div>

{% endblock %}
